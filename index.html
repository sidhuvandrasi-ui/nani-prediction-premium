* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --blue: #168cff;
    --cyan: #55d5ff;
    --background: #050914;
}

html {
    min-height: 100%;
    background: var(--background);
}

body {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    overflow-x: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: #ffffff;
    background:
        radial-gradient(ellipse at 50% 0%, rgba(0,119,255,.19), transparent 48%),
        radial-gradient(ellipse at 0% 100%, rgba(0,70,180,.15), transparent 42%),
        var(--background);
}

/* Background Grid */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .16;
    background-image:
        linear-gradient(rgba(70,150,255,.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(70,150,255,.09) 1px, transparent 1px);
    background-size: 35px 35px;
    mask-image: linear-gradient(to bottom, black, transparent 90%);
    -webkit-mask-image: linear-gradient(to bottom, black, transparent 90%);
}

.glow {
    position: fixed;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .22;
    pointer-events: none;
}

.glow-one {
    background: #087bff;
    top: 4%;
    left: -120px;
}

.glow-two {
    background: #00c8ff;
    bottom: -30px;
    right: -120px;
}

/* Main Layout */

.container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 390px;
    margin: auto;
}

.card {
    position: relative;
    padding: 28px 22px 24px;
    text-align: center;
    border-radius: 27px;
    border: 1px solid rgba(83,170,255,.30);
    background: linear-gradient(

    );

        inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    overflow: hidden;
}

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 15%;
    width: 70%;
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        #45caff,
        transparent
    );
}

/* Official Badge */

.badge {
    display: inline-flex;

}

    height: 6px;

}

    border-radius: 26px;

    box-shadow:
        0 0 28px rgba(0,130,255,.24),

    overflow: hidden;
}

.logo-box img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;

    display: block;
}

.logo-placeholder {
    color: #75caff;
    font-size: 13px;

h1 {

}

    color: #69c9ff;
    background: linear-gradient(
        90deg,
        #75c9ff,
        #ffffff,
        #53aaff
    );
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

    color: #aabbd1;
    font-size: 12px;
    line-height: 1.8;
}

.divider {

    );
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.stat {
    padding: 13px 7px;
    border: 1px solid rgba(112,163,220,.17);
    border-radius: 15px;
    background: rgba(255,255,255,.025);
}

.stat strong {
    display: block;
    color: #eaf6ff;
    font-size: 13px;
    font-weight: 900;
}

.stat span {
    display: block;
    margin-top: 6px;
    color: #8299b7;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.join-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    min-height: 56px;
    margin-top: 22px;
    padding: 15px 10px;
    overflow: hidden;
    border: 1px solid rgba(160,222,255,.70);
    border-radius: 15px;
    background: linear-gradient(
        105deg,
        #0874ed,

    letter-spacing: .7px;
    text-decoration: none;
    transition: transform .2s, box-shadow .2s;

    -webkit-tap-highlight-color: transparent;
}

.join-btn:hover {
    box-shadow: 0 8px 35px rgba(0,145,255,.42);
}

.join-btn:active {
    transform: scale(.98);
}

.telegram-icon {
    width: 23px;
    height: 23px;
    flex-shrink: 0;
}

/* Footer */

.secure {
    margin-top: 16px;
    color: #7f94af;
    font-size: 9px;
    letter-spacing: .5px;
    line-height: 1.7;
}

.footer {
    margin-top: 20px;
    color: #506580;
    font-size: 9px;
    letter-spacing: 1.5px;
}

/* Animations */

@keyframes buttonShine {
    0%, 100% {
        background-position: 0% 50%;
    }
    50% {
        background-position: 100% 50%;
    }
}

/* Short Mobile Screens */

@media (max-height: 720px) {
    body {
        padding: 12px;
    }

    .card {
        padding: 20px 18px;
    }

    .logo-box {
        width: 78px;
        height: 78px;
        margin: 14px auto;
        border-radius: 20px;
    }

    .divider {
        margin: 15px 0;
    }

    .join-btn {
        margin-top: 15px;
        min-height: 51px;
    }

    .footer {
        margin-top: 13px;
    }
}

/* Accessibility */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}
